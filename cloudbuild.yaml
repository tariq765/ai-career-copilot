steps:
  # 1. Build the Docker image from backend directory
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ai-career-copilot-backend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/ai-career-copilot-backend:latest', './backend']

  # 2. Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-career-copilot-backend:$COMMIT_SHA']

  # 3. Deploy the container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ai-career-copilot-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ai-career-copilot-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'

images:
  - 'gcr.io/$PROJECT_ID/ai-career-copilot-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ai-career-copilot-backend:latest'
